mutation CreateUser @auth(level: USER) {
  user_insert(data: {
    id_expr: "auth.uid",
    email: "user@example.com",
    createdAt_expr: "request.time",
    displayName: "New User"
  })
}

mutation UpdateUser($displayName: String) @auth(level: USER) {
  user_update(key: { id_expr: "auth.uid" }, data: { displayName: $displayName })
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: { id_expr: "auth.uid" })
}

query GetCurrentUser @auth(level: USER) {
  user(key: { id_expr: "auth.uid" }) {
    email
    displayName
    createdAt
  }
}

query ListUsers @auth(level: USER) {
  users {
    id
    email
    displayName
  }
}

mutation CreatePortfolio($name: String!, $description: String) @auth(level: USER) {
  portfolio_insert(data: {
    name: $name,
    description: $description,
    user: { id_expr: "auth.uid" }
  })
}

mutation UpdatePortfolio($id: UUID!, $name: String) @auth(level: USER) {
  portfolio_update(key: { id: $id }, data: { name: $name })
}

mutation DeletePortfolio($id: UUID!) @auth(level: USER) {
  portfolio_delete(key: { id: $id })
}

query GetPortfolio($id: UUID!) @auth(level: USER) {
  portfolio(key: { id: $id }) {
    name
    description
    assets_on_portfolio { tickerSymbol name }
  }
}

query ListMyPortfolios @auth(level: USER) {
  portfolios(where: { userId: { eq_expr: "auth.uid" } }) {
    id
    name
  }
}

mutation CreateAsset($ticker: String!, $name: String!, $type: String!, $portfolioId: UUID!) @auth(level: USER) {
  asset_insert(data: {
    tickerSymbol: $ticker,
    name: $name,
    type: $type,
    portfolio: { id: $portfolioId }
  })
}

mutation UpdateAsset($id: UUID!, $price: Float) @auth(level: USER) {
  asset_update(key: { id: $id }, data: { currentPrice: $price })
}

mutation DeleteAsset($id: UUID!) @auth(level: USER) {
  asset_delete(key: { id: $id })
}

query GetAsset($id: UUID!) @auth(level: USER) {
  asset(key: { id: $id }) {
    tickerSymbol
    currentPrice
  }
}

query ListAssets($portfolioId: UUID!) @auth(level: USER) {
  assets(where: { portfolioId: { eq: $portfolioId } }) {
    tickerSymbol
    name
  }
}

mutation CreateHolding($quantity: Float!, $purchasePrice: Float!, $assetId: UUID!) @auth(level: USER) {
  holding_insert(data: {
    quantity: $quantity,
    purchasePrice: $purchasePrice,
    purchaseDate_expr: "request.time",
    asset: { id: $assetId }
  })
}

mutation UpdateHolding($id: UUID!, $quantity: Float) @auth(level: USER) {
  holding_update(key: { id: $id }, data: { quantity: $quantity })
}

mutation DeleteHolding($id: UUID!) @auth(level: USER) {
  holding_delete(key: { id: $id })
}

query GetHolding($id: UUID!) @auth(level: USER) {
  holding(key: { id: $id }) {
    quantity
    purchasePrice
  }
}

query ListHoldings($assetId: UUID!) @auth(level: USER) {
  holdings(where: { assetId: { eq: $assetId } }) {
    quantity
    purchaseDate
  }
}

mutation CreateDividend($amount: Float!, $assetId: UUID!) @auth(level: USER) {
  dividend_insert(data: {
    amount: $amount,
